name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tejiendohogar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d tejiendohogar_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: tejiendohogar_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEFAULT_FROM_EMAIL: ci@tejiendohogar.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: pytest --cov=apps.accounts --cov-fail-under=80
        working-directory: backend
