<ol class="pasos" aria-label="Pasos de la compra">
  <li class="{% if paso > 1 %}paso-hecho{% elif paso == 1 %}paso-actual{% endif %}"{% if paso == 1 %} aria-current="step"{% endif %}><span class="paso-num" aria-hidden="true">{% if paso > 1 %}✓{% else %}1{% endif %}</span><span>Bolsa y envío</span>{% if paso > 1 %}<span class="visually-hidden"> (completado)</span>{% endif %}</li>
  <li class="{% if paso > 2 %}paso-hecho{% elif paso == 2 %}paso-actual{% endif %}"{% if paso == 2 %} aria-current="step"{% endif %}><span class="paso-num" aria-hidden="true">{% if paso > 2 %}✓{% else %}2{% endif %}</span><span>Simular pago</span>{% if paso > 2 %}<span class="visually-hidden"> (completado)</span>{% endif %}</li>
  <li class="{% if paso == 3 %}paso-actual{% endif %}"{% if paso == 3 %} aria-current="step"{% endif %}><span class="paso-num" aria-hidden="true">3</span><span>Entrega</span></li>
</ol>
